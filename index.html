<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人偏好与学习方向自我分析表</title>
  <style>
    :root {
      --bg-color: #09090b;
      --card-bg: rgba(255, 255, 255, 0.03);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-start: #8b5cf6;
      --accent-end: #3b82f6;
      --focus-glow: rgba(139, 92, 246, 0.3);
      --progress-bg: rgba(255, 255, 255, 0.05);
      --progress-fill: linear-gradient(90deg, var(--accent-start), var(--accent-end));
      --shadow-color: rgba(0,0,0,0.2);
      --modal-bg: rgba(0,0,0,0.6);
    }

    :root.light {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.8);
      --text-main: #1d1d1f;
      --text-muted: #86868b;
      --border-color: rgba(0, 0, 0, 0.1);
      --focus-glow: rgba(139, 92, 246, 0.2);
      --progress-bg: rgba(0, 0, 0, 0.05);
      --progress-fill: linear-gradient(90deg, #0070f3, #5856d6);
      --shadow-color: rgba(0,0,0,0.08);
      --modal-bg: rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 64px 20px;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.15), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(236, 72, 153, 0.1), transparent 30%),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      background-attachment: fixed;
      transition: background-color 0.3s, color 0.3s;
    }

    :root.light body {
      background-image:
        radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.1), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.1), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(236, 72, 153, 0.08), transparent 30%),
        linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      box-shadow: 0 4px 24px -1px var(--shadow-color), inset 0 1px 0 rgba(255,255,255,0.1);
      padding: 48px;
      border: 1px solid var(--border-color);
      animation: fadeUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---- Header ---- */
    header {
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-left { text-align: left; }

    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
      background: linear-gradient(to right, var(--text-main), var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .lang-toggle {
      background: var(--progress-bg);
      border: 1px solid var(--border-color);
      border-radius: 99px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.02em;
    }
    .lang-toggle:hover { color: var(--accent-start); border-color: var(--accent-start); }
    .lang-toggle .lang-active { color: var(--accent-start); }

    /* ---- Profile Selector ---- */
    .profile-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .profile-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid var(--border-color);
      background: var(--progress-bg);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .profile-tab:hover { border-color: var(--accent-start); color: var(--text-main); }
    .profile-tab.active { background: var(--accent-start); border-color: var(--accent-start); color: #fff; }
    .profile-tab .del {
      width: 12px; height: 12px; border-radius: 50%;
      background: rgba(239,68,68,0.4); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; line-height: 1; padding-bottom: 1px;
      cursor: pointer; border: none;
    }
    .profile-tab .del:hover { background: #ef4444; }

    .btn-new-profile {
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px dashed var(--border-color);
      background: transparent;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-new-profile:hover { border-color: var(--accent-start); color: var(--accent-start); }

    /* ---- Theme Toggle ---- */
    .theme-toggle {
      background: var(--progress-bg);
      border: 1px solid var(--border-color);
      border-radius: 99px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .theme-toggle:hover { color: var(--text-main); border-color: var(--accent-start); }
    .theme-toggle svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ---- Progress Bar ---- */
    .progress-wrapper { margin-bottom: 28px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--progress-bg);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--progress-fill);
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .table-wrapper { overflow-x: auto; padding-bottom: 24px; }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 14px;
    }

    th, td { padding: 10px 16px; text-align: left; }

    th {
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    tbody tr { transition: background-color 0.2s ease; }
    tbody tr:not(:last-child) td { border-bottom: 1px solid rgba(255,255,255,0.03); }
    :root.light tbody tr:not(:last-child) td { border-bottom: 1px solid rgba(0,0,0,0.04); }

    .category-cell {
      font-weight: 600;
      vertical-align: top;
      color: var(--text-main);
      width: 20%;
      padding-top: 14px;
    }

    .item-cell { width: 35%; color: var(--text-muted); }

    .input-cell {
      width: 45%;
      cursor: text;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      border-radius: 6px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid transparent;
      color: var(--text-main);
    }
    :root.light .input-cell { background: rgba(0,0,0,0.02); }

    .input-cell:empty:before {
      content: attr(data-placeholder);
      color: rgba(255,255,255,0.15);
      pointer-events: none;
    }
    :root.light .input-cell:empty:before { color: rgba(0,0,0,0.2); }

    .input-cell:hover { background-color: rgba(255,255,255,0.04); }
    :root.light .input-cell:hover { background-color: rgba(0,0,0,0.04); }

    .input-cell:focus {
      background-color: rgba(255,255,255,0.05);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 2px var(--focus-glow);
    }
    :root.light .input-cell:focus { background-color: rgba(0,0,0,0.03); border-color: var(--accent-start); }

    /* ---- Suggestion Menu ---- */
    #suggestion-menu {
      position: absolute;
      background: rgba(20, 20, 25, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 360px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    :root.light #suggestion-menu { background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.15); }
    #suggestion-menu.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .suggestion-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      user-select: none;
    }
    :root.light .suggestion-item { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.1); }
    .suggestion-item:hover { background: var(--accent-start); border-color: var(--accent-start); color: #fff; transform: translateY(-1px); }

    /* ---- Actions Bar ---- */
    .actions {
      margin-top: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .note { color: var(--text-muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .note::before { content: '💡'; }

    .actions-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* Export / Import Dropdown */
    .dropdown { position: relative; }
    .dropdown-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      background: rgba(20,20,25,0.95);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      padding: 8px;
      min-width: 210px;
      z-index: 1001;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    :root.light .dropdown-menu { background: rgba(255,255,255,0.97); border-color: rgba(0,0,0,0.12); }
    .dropdown-menu.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .dropdown-item {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      transition: all 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .dropdown-item:hover { background: rgba(255,255,255,0.08); color: var(--text-main); }
    :root.light .dropdown-item:hover { background: rgba(0,0,0,0.05); }
    .dropdown-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      color: var(--text-main);
    }
    .dropdown-item .tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(139,92,246,0.2);
      color: var(--accent-start);
      font-weight: 600;
      white-space: nowrap;
    }
    .dropdown-item .desc { display: block; font-size: 11px; color: var(--text-muted); line-height: 1.4; }
    .dropdown-divider { height: 1px; background: var(--border-color); margin: 6px 0; }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    .btn-primary {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border-color: var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .btn-primary:hover { background-color: rgba(255, 255, 255, 0.15); border-color: var(--accent-start); }
    .btn-primary:active { transform: scale(0.96); }
    :root.light .btn-primary { background-color: rgba(0,0,0,0.05); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-muted);
      border-color: var(--border-color);
    }
    .btn-secondary:hover { color: var(--text-main); background-color: rgba(255,255,255,0.05); }
    :root.light .btn-secondary:hover { background-color: rgba(0,0,0,0.04); }

    .btn-danger { background-color: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
    .btn-danger:hover { background-color: rgba(239, 68, 68, 0.25); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 10000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-bg);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      width: min(480px, 90vw);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.02em; }
    .modal p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .modal-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--progress-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    .modal-input:focus { border-color: var(--accent-start); }
    :root.light .modal-input { background: rgba(0,0,0,0.04); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* Template Grid */
    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .template-card {
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--progress-bg);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .template-card:hover { border-color: var(--accent-start); background: rgba(139,92,246,0.1); }
    .template-card .icon { font-size: 24px; margin-bottom: 6px; }
    .template-card .name { font-size: 12px; font-weight: 600; color: var(--text-main); }

    /* Responsive */
    @media (max-width: 640px) {
      body { padding: 24px 16px; }
      .container { padding: 24px 20px; }
      h1 { font-size: 24px; }
      header { flex-direction: column; gap: 12px; }
      .header-left { text-align: center; width: 100%; }
      .header-controls { align-self: center; justify-content: center; }
      .profile-bar { justify-content: center; }
      .actions { flex-direction: column-reverse; align-items: stretch; }
      .actions-right { justify-content: center; }
      .note { justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-left">
        <h1 id="site-title">My Preferences & Goals</h1>
        <div class="subtitle" id="site-subtitle">个人偏好与技能设定</div>
      </div>
      <div class="header-controls">
        <button class="lang-toggle" onclick="toggleLang()" title="Switch Language">
          <span id="lang-zh" class="lang-active">中</span>
          <span>/</span>
          <span id="lang-en">EN</span>
        </button>
        <button class="theme-toggle" onclick="toggleTheme()">
          <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <span id="theme-label">深色</span>
        </button>
      </div>
    </header>

    <!-- Profile Selector -->
    <div class="profile-bar" id="profile-bar">
      <button class="btn-new-profile" id="btn-new-profile" onclick="openNewProfileModal()">+ 新建档案</button>
    </div>

    <div class="progress-wrapper">
      <div class="progress-label">
        <span id="progress-label-text">填写进度</span>
        <span id="progress-text">0 / 28</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="table-wrapper">
      <table id="analysis-table">
        <thead>
          <tr>
            <th id="th-category">分类</th>
            <th id="th-item">具体项目</th>
            <th id="th-input">你的填写 (可自填或选标签)</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Injected by JS from TEMPLATE_DATA -->
        </tbody>
      </table>
    </div>

    <div class="actions">
      <div class="note" id="note-text">直接点击表格中的"你的填写"列进行编辑，支持打字或选择标签，数据会自动保存在浏览器中。</div>
      <div class="actions-right">
        <button class="btn btn-secondary" onclick="resetCurrentProfile()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
          <span id="btn-reset-text">重置</span>
        </button>
        <div class="dropdown">
          <button class="btn btn-secondary" onclick="toggleMenu('import-menu')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <span id="btn-import-text">导入</span>
          </button>
          <div class="dropdown-menu" id="import-menu">
            <button class="dropdown-item" onclick="openTemplateModal()">
              <div class="dropdown-item-header">
                <strong id="import-template-title">从模板加载</strong>
                <span class="tag">NEW</span>
              </div>
              <span class="desc" id="import-template-desc">程序员 / 产品经理 / 学生...</span>
            </button>
            <div class="dropdown-divider"></div>

function applyI18n() {
  const t = I18N[lang];
  document.getElementById('site-title').innerText = t.siteTitle;
  document.getElementById('site-subtitle').innerText = t.siteSubtitle;
  document.getElementById('th-category').innerText = t.thCategory;
  document.getElementById('th-item').innerText = t.thItem;
  document.getElementById('th-input').innerText = t.thInput;
  document.getElementById('progress-label-text').innerText = t.progressLabel;
  document.getElementById('note-text').innerText = t.note;
  document.getElementById('btn-reset-text').innerText = t.btnReset;
  document.getElementById('btn-import-text').innerText = t.btnImport;
  document.getElementById('btn-export-text').innerText = t.btnExport;
  document.getElementById('import-template-title').innerText = t.importTemplateTitle;
  document.getElementById('import-template-desc').innerText = t.importTemplateDesc;
  document.getElementById('import-json-title').innerText = t.importJsonTitle;
  document.getElementById('import-json-desc').innerText = t.importJsonDesc;
  document.getElementById('export-md-desc').innerText = t.exportMdDesc;
  document.getElementById('export-json-desc').innerText = t.exportJsonDesc;
  document.getElementById('export-prompt-desc').innerText = t.exportPromptDesc;
  document.getElementById('export-text-desc').innerText = t.exportTextDesc;
  document.getElementById('modal-new-profile-title').innerText = t.modalNewProfileTitle;
  document.getElementById('modal-new-profile-desc').innerText = t.modalNewProfileDesc;
  document.getElementById('modal-cancel-text').innerText = t.modalCancel;
  document.getElementById('modal-create-text').innerText = t.modalCreate;
  document.getElementById('modal-template-title').innerText = t.modalTemplateTitle;
  document.getElementById('modal-template-desc').innerText = t.modalTemplateDesc;
  document.getElementById('modal-template-cancel').innerText = t.modalTemplateCancel;
  document.getElementById('btn-new-profile').innerText = t.btnNewProfile;
  
  const isLight = document.documentElement.classList.contains('light');
  updateThemeUI(isLight);
  
  // Re-render template modal if open
  if(document.getElementById('modal-template').classList.contains('show')) openTemplateModal();
}

function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem(LANG_KEY, lang);
  updateLangUI();
  applyI18n();
  renderTable();
  renderProfileBar();
  updateProgress();
}

function updateLangUI() {
  document.getElementById('lang-zh').className = lang === 'zh' ? 'lang-active' : '';
  document.getElementById('lang-en').className = lang === 'en' ? 'lang-active' : '';
}

function getTemplateOptions(id) {
  const t = TEMPLATE_DATA.find(t => t.id === id);
  return t ? (t.options[lang] || t.options['zh']) : '';
}

function init() {
  loadProfiles();
  updateLangUI();
  applyI18n();
  renderTable();
  renderProfileBar();
  loadTheme();
  updateProgress();
  // Load current profile data into cells
  Object.entries(profiles[currentProfile]?.values || {}).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (el) el.innerText = val;
  });
  // Update progress after loading
  setTimeout(updateProgress, 50);
}

// ====== PROFILES ======
function loadProfiles() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      profiles = JSON.parse(saved);
    } else {
      profiles = { default: { name: 'default', values: {} } };
    }
    currentProfile = Object.keys(profiles)[0];
  } catch(e) {
    profiles = { default: { name: 'default', values: {} } };
    currentProfile = 'default';
  }
}

function saveProfiles() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
}

function renderProfileBar() {
  const bar = document.getElementById('profile-bar');
  const t = I18N[lang];
  const tabs = Object.entries(profiles).map(([id, p]) => {
    const displayName = (id === 'default' || p.name === 'default' || p.name === '默认档案') ? t.profileDefault : p.name;
    return `
    <div class="profile-tab ${id === currentProfile ? 'active' : ''}" onclick="switchProfile('${id}')">
      ${displayName}
      ${id !== 'default' ? `<button class="del" onclick="event.stopPropagation();deleteProfile('${id}')">×</button>` : ''}
    </div>
  `}).join('');
  bar.innerHTML = `<button class="btn-new-profile" id="btn-new-profile" onclick="openNewProfileModal()">${t.btnNewProfile}</button>` + tabs;
}

function switchProfile(id) {
  // Save current
  saveCurrentToProfile();
  currentProfile = id;
  // Clear cells
  document.querySelectorAll('.input-cell').forEach(c => c.innerText = '');
  // Load new
  Object.entries(profiles[id]?.values || {}).forEach(([cellId, val]) => {
    const el = document.getElementById(cellId);
    if (el) el.innerText = val;
  });
  renderProfileBar();
  updateProgress();
}

function saveCurrentToProfile() {
  const values = {};
  document.querySelectorAll('.input-cell').forEach(c => {
    if (c.innerText.trim()) values[c.id] = c.innerText.trim();
  });
  profiles[currentProfile] = profiles[currentProfile] || { name: profiles[currentProfile]?.name || 'default', values: {} };
  profiles[currentProfile].values = values;
  saveProfiles();
}

function openNewProfileModal() {
  document.getElementById('new-profile-name').value = '';
  document.getElementById('modal-new-profile').classList.add('show');
  setTimeout(() => document.getElementById('new-profile-name').focus(), 100);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

function createProfile() {
  const name = document.getElementById('new-profile-name').value.trim();
  if (!name) return;
  const id = 'profile_' + Date.now();
  profiles[id] = { name, values: {} };
  saveProfiles();
  closeModal('modal-new-profile');
  renderProfileBar();
  switchProfile(id);
  showToast(`${I18N[lang].toastCreated}${name}`);
}

function deleteProfile(id) {
  if (!confirm(`${I18N[lang].confirmDelete}${profiles[id]?.name}${I18N[lang].confirmDeleteSuffix}`)) return;
  const name = profiles[id]?.name;
  delete profiles[id];
  saveProfiles();
  if (currentProfile === id) currentProfile = Object.keys(profiles)[0];
  renderProfileBar();
  switchProfile(currentProfile);
  showToast(`${I18N[lang].toastDeleted}${name}`);
}

// ====== RENDER TABLE ======
function renderTable() {
  const tbody = document.getElementById('table-body');
  let html = '';
  TABLE_ROWS.forEach((section, si) => {
    section.items.forEach(([id, label], ii) => {
      const isFirst = si === 0 && ii === 0;
      const isCategoryFirst = ii === 0;
      const isLast = si === TABLE_ROWS.length - 1 && ii === section.items.length - 1;
      const catRowspan = section.items.length;
      const options = getTemplateOptions(id);
      
      const categoryLabel = section.category[lang] || section.category['zh'];
      const itemLabel = label[lang] || label['zh'];
      const placeholder = I18N[lang].placeholder;
      
      html += `<tr>
        ${isCategoryFirst ? `<td rowspan="${catRowspan}" class="category-cell" style="${isLast ? 'border-bottom:none' : ''}">${categoryLabel}</td>` : ''}
        <td class="item-cell">${itemLabel}</td>
        <td class="input-cell" contenteditable="true" data-placeholder="${placeholder}"
          data-options="${options}"
          id="${id}" ${isLast ? 'style="border-bottom:none"' : ''}></td>
      </tr>`;
    });
  });
  tbody.innerHTML = html;

  // Reattach cell events
  document.querySelectorAll('.input-cell').forEach(cell => {
    cell.addEventListener('focus', () => showSuggestions(cell));
    cell.addEventListener('input', e => {
      localStorage.setItem('self_analysis_' + currentProfile + '_' + e.target.id, e.target.innerText);
      updateProgress();
    });
  });
  
  // Re-fill data
  Object.entries(profiles[currentProfile]?.values || {}).forEach(([cellId, val]) => {
    const el = document.getElementById(cellId);
    if (el) el.innerText = val;
  });
}

// ====== SUGGESTIONS ======
let currentCell = null;
const suggestionMenu = document.createElement('div');
suggestionMenu.id = 'suggestion-menu';
document.body.appendChild(suggestionMenu);

function showSuggestions(cell) {
  currentCell = cell;
  const opts = cell.getAttribute('data-options');
  if (!opts) { suggestionMenu.classList.remove('show'); return; }
  suggestionMenu.innerHTML = '';
  opts.split(',').map(s => s.trim()).filter(Boolean).forEach(opt => {
    const item = document.createElement('div');
    item.className = 'suggestion-item';
    item.innerText = opt;
    item.addEventListener('mousedown', e => e.preventDefault());
    item.addEventListener('click', () => { insertOption(opt); });
    suggestionMenu.appendChild(item);
  });
  const rect = cell.getBoundingClientRect();
  suggestionMenu.style.top = (rect.bottom + window.scrollY + 8) + 'px';
  suggestionMenu.style.left = (rect.left + window.scrollX) + 'px';
  suggestionMenu.style.width = Math.max(300, rect.width) + 'px';
  suggestionMenu.classList.add('show');
}

function insertOption(text) {
  if (!currentCell) return;
  let cur = currentCell.innerText.trim();
  if (cur && !cur.endsWith('，') && !cur.endsWith(',')) cur += (lang === 'en' ? ', ' : '，');
  currentCell.innerText = cur + text;
  const key = 'self_analysis_' + currentProfile + '_' + currentCell.id;
  localStorage.setItem(key, currentCell.innerText);
  currentCell.focus();
  updateProgress();
  const range = document.createRange();
  range.selectNodeContents(currentCell);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

document.addEventListener('mousedown', e => {
  if (!suggestionMenu.contains(e.target) && e.target !== currentCell) {
    suggestionMenu.classList.remove('show');
  }
});

// ====== PROGRESS ======
function updateProgress() {
  const filled = document.querySelectorAll('.input-cell:not(:empty)').length;
  const total = TEMPLATE_DATA.length;
  const pct = Math.round((filled / total) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').innerText = filled + ' / ' + total;
}

// ====== THEME ======
function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light');
  localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
  updateThemeUI(isLight);
}
function updateThemeUI(isLight) {
  document.getElementById('theme-icon-dark').style.display = isLight ? 'none' : '';
  document.getElementById('theme-icon-light').style.display = isLight ? '' : 'none';
  document.getElementById('theme-label').innerText = isLight ? I18N[lang].themeLight : I18N[lang].themeDark;
}
function loadTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === 'light') {
    document.documentElement.classList.add('light');
    updateThemeUI(true);
  }
}

// ====== DROPDOWNS ======
function toggleMenu(id) {
  ['export-menu', 'import-menu'].forEach(m => {
    if (m !== id) document.getElementById(m).classList.remove('show');
  });
  document.getElementById(id).classList.toggle('show');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown')) {
    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
  }
});

// ====== EXPORT ======
function exportAs(format) {
  document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
  saveCurrentToProfile();
  const now = new Date();
  const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const profileName = (currentProfile === 'default' || profiles[currentProfile]?.name === 'default') ? I18N[lang].profileDefault : (profiles[currentProfile]?.name || I18N[lang].profileDefault);
  const data = getAllData();
  let content = '';
  if (format === 'markdown') content = buildMarkdown(data, dateStr, profileName);
  else if (format === 'json') content = buildJSON(data, dateStr, profileName);
  else if (format === 'prompt') content = buildSystemPrompt(data, dateStr, profileName);
  else if (format === 'text') content = buildText(data, dateStr, profileName);
  
  let formatName = '';
  if(format === 'markdown') formatName = I18N[lang].exportMd;
  else if(format === 'json') formatName = I18N[lang].exportJson;
  else if(format === 'prompt') formatName = I18N[lang].exportPrompt;
  else if(format === 'text') formatName = I18N[lang].exportText;
  
  copyToClipboard(content, `${I18N[lang].toastCopied}${formatName}！`);
}

function getAllData() {
  const result = {};
  document.querySelectorAll('.input-cell').forEach(c => {
    result[c.id] = c.innerText.trim();
  });
  return result;
}

function buildMarkdown(data, dateStr, profileName) {
  const rows = [];
  TABLE_ROWS.forEach(section => {
    section.items.forEach(([id, label]) => {
      rows.push({ category: section.category[lang], item: label[lang], value: data[id] || '—' });
    });
  });
  const comm1 = data['comm-1'] || '待填写';
  const comm2 = data['comm-2'] || '待填写';
  const comm3 = data['comm-3'] || '待填写';
  
  let md = `## 🤖 给 AI 的指令
`;
  if (lang === 'en') md = `## 🤖 Instructions for AI
`;
  
  if (lang === 'zh') {
    md += `请以"${comm3}"的风格，用"${comm2}"的形式回答。
`;
    md += `【档案】${profileName} | 更新时间：${dateStr}
---
# 个人偏好与技能设定

`;
  } else {
    md += `Please respond in a "${comm3}" tone, using "${comm2}" format.
`;
    md += `[Profile] ${profileName} | Updated: ${dateStr}
---
# Personal Preferences & Skills

`;
  }
  
  rows.forEach(({ category, item, value }) => {
    md += `| **${category}** | ${item} | ${value} |
`;
  });
  return md;
}

function buildJSON(data, dateStr, profileName) {
  const out = {
    profile: profileName,
    updatedAt: dateStr,
    total: TEMPLATE_DATA.length,
    filled: Object.values(data).filter(Boolean).length,
    values: data
  };
  return JSON.stringify(out, null, 2);
}

function buildSystemPrompt(data, dateStr, profileName) {
  const comm1 = data['comm-1'] || (lang === 'zh' ? '专业直接' : 'Professional & Direct');
  const comm2 = data['comm-2'] || (lang === 'zh' ? '结构化表格' : 'Structured Tables');
  const comm3 = data['comm-3'] || (lang === 'zh' ? '客观专业' : 'Objective & Professional');
  const art1 = data['art-1'] || (lang === 'zh' ? '极简主义' : 'Minimalism');
  
  if (lang === 'en') {
    return `[Role Setting] You are a ${comm3} personal growth assistant, codename "${profileName}".

[User Profile]
- Comm Style: ${comm1}
- Format: ${comm2}
- Tone/Vibe: ${comm3}
- Aesthetics: ${art1}
- Tech Stack: ${data['tech-3'] || 'TBD'}
- AI/LLM: ${data['tech-2'] || 'TBD'}
- Recent Goals: ${data['goal-1'] || 'TBD'}

[Behavioral Guidelines]
- Tone: ${comm3}, ${comm1}
- Prioritize ${comm2} format
- Code examples should use ${art1} style
- Avoid fluff, every sentence must contain information

[Last Updated] ${dateStr}`;
  }
  
  return `【角色设定】你是一位${comm3}的个人成长助理，代号"${profileName}"。

【用户画像】
- 沟通风格：${comm1}
- 回答形式：${comm2}
- 语气氛围：${comm3}
- 审美偏好：${art1}
- 技术栈：${data['tech-3'] || '待填写'}
- AI/大模型：${data['tech-2'] || '待填写'}
- 近期目标：${data['goal-1'] || '待填写'}

【行为准则】
- 风格：${comm3}，${comm1}
- 优先使用${comm2}形式回复
- 代码示例使用${art1}风格
- 避免冗余，每句话要有信息量

【更新时间】${dateStr}`;
}

function buildText(data, dateStr, profileName) {
  let txt = `【${profileName}】${I18N[lang].siteSubtitle} (${dateStr})
${'='.repeat(36)}

`;
  TABLE_ROWS.forEach(section => {
    txt += `
【${section.category[lang]}】
`;
    section.items.forEach(([id, label]) => {
      txt += `  · ${label[lang]}：${data[id] || '(未填写/Empty)'}
`;
    });
  });
  return txt;
}

// ====== IMPORT ======
function importFromJSON() {
  document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
  document.getElementById('json-file-input').click();
}

function handleFileImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const json = JSON.parse(ev.target.result);
      const values = json.values || json.entries || {};
      const profileName = json.profile || '导入档案';
      const id = 'profile_' + Date.now();
      profiles[id] = { name: profileName, values };
      saveProfiles();
      switchProfile(id);
      showToast(`${I18N[lang].toastImport}${profileName}，共 ${Object.values(values).filter(Boolean).length} ${I18N[lang].toastImportItems}`);
    } catch(err) {
      showToast(I18N[lang].toastJsonError);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function openTemplateModal() {
  document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
  const grid = document.getElementById('template-grid');
  grid.innerHTML = Object.entries(PRESET_TEMPLATES).map(([id, t]) => `
    <div class="template-card" onclick="loadTemplate('${id}')">
      <div class="icon">${t.icon}</div>
      <div class="name">${t.name[lang] || t.name.zh}</div>
      <div class="name-en">${t.name.en || ''}</div>
    </div>
  `).join('');
  document.getElementById('modal-template').classList.add('show');
}

function loadTemplate(id) {
  const t = PRESET_TEMPLATES[id];
  if (!t) return;
  saveCurrentToProfile();
  document.querySelectorAll('.input-cell').forEach(c => c.innerText = '');
  Object.entries(t.values).forEach(([cellId, val]) => {
    const el = document.getElementById(cellId);
    if (el) el.innerText = val[lang] || val['zh'] || val;
  });
  closeModal('modal-template');
  updateProgress();
  showToast(`${I18N[lang].toastLoaded}${t.name[lang] || t.name.zh}${I18N[lang].toastTemplate}`);
}

// ====== RESET ======
function resetCurrentProfile() {
  if (!confirm(I18N[lang].confirmReset)) return;
  document.querySelectorAll('.input-cell').forEach(c => c.innerText = '');
  profiles[currentProfile].values = {};
  saveProfiles();
  updateProgress();
  showToast(I18N[lang].toastReset);
}

// ====== COPY ======
function copyToClipboard(text, msg) {
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
  } else { fallbackCopy(text, msg); }
}
function fallbackCopy(text, msg) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); showToast(msg); } catch { showToast(I18N[lang].toastCopyFail); }
  document.body.removeChild(ta);
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ====== AUTO-SAVE on input ======
document.querySelectorAll('.input-cell').forEach(cell => {
  cell.addEventListener('input', e => {
    const key = 'self_analysis_' + currentProfile + '_' + e.target.id;
    localStorage.setItem(key, e.target.innerText);
    updateProgress();
  });
});

// ====== BOOT ======
init();
</script>
